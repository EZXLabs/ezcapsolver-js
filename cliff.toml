# git-cliff configuration
# https://git-cliff.org/docs/configuration
# Requires git-cliff 2.14.1 or newer.

[changelog]
# Full changelogs include this header. Release notes use `--strip header`.
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""

# Render one section per release. GitHub metadata is used when available, with
# commit links and local author names as offline fallbacks.
body = """
{%- macro remote_url() -%}
https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}
{% set has_remote = remote.github.owner and remote.github.repo %}

{% for entry in commits | commit_groups(groups=commit_parsers_groups) -%}
## {{ entry.group | trim | upper_first }}

{% for commit in entry.commits -%}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
{% if commit.breaking %}**BREAKING:** {% endif %}\
{{ commit.message | split(pat="\n") | first | trim | upper_first }} \
{% if has_remote and commit.remote.pr_number %}\
([#{{ commit.remote.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.remote.pr_number }}))\
{% elif has_remote %}\
([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }}))\
{% else %}\
(`{{ commit.id | truncate(length=7, end="") }}`)\
{% endif %}\
{% if commit.remote.pr_author %} by @{{ commit.remote.pr_author }}\
{% elif commit.remote.username %} by @{{ commit.remote.username }}\
{% elif commit.author.name %} by {{ commit.author.name }}\
{% endif %}
{% endfor %}
{% endfor -%}

{% if github and github.contributors | filter(attribute="is_first_time", value=true) | length != 0 %}
## ❤️ New Contributors

{% for contributor in github.contributors | filter(attribute="is_first_time", value=true) -%}
- @{{ contributor.username }} made their first contribution\
{% if contributor.pr_numbers | length != 0 %} in \
{% for pr_number in contributor.pr_numbers %}\
[#{{ pr_number }}]({{ self::remote_url() }}/pull/{{ pr_number }})\
{% if not loop.last %}, {% endif %}\
{% endfor %}\
{% elif contributor.pr_number %} in \
[#{{ contributor.pr_number }}]({{ self::remote_url() }}/pull/{{ contributor.pr_number }})\
{% endif %}
{% endfor %}
{% endif %}
"""

footer = """
<!-- generated by git-cliff -->
"""

# git-cliff 2.14+ normalizes Markdown spacing after rendering.
format = true
trim = true
render_always = true

[git]
# Keep non-conventional commits visible under "Other" instead of silently
# dropping changes from release notes.
conventional_commits = true
filter_unconventional = false
require_conventional = false
split_commits = false

# Preserve commit bodies so Conventional Commit footers and security details
# remain available to the parsers. The template renders only the subject line.
commit_preprocessors = []

# A breaking commit must remain visible even if it resembles a release commit.
protect_breaking_commits = true

# `commit_groups` renders groups in this parser order, so no hidden HTML sorting
# prefixes are needed.
commit_parsers = [
  # Breaking changes are always the first and most visible section.
  { field = "breaking", pattern = "true", group = "💥 Breaking Changes" },

  # Explicit opt-out markers.
  { message = "(?i)\\[(skip|changelog[ -]skip|skip[ -]changelog|release[ -]skip|skip[ -]release)\\]", skip = true },
  { footer = "(?i)^changelog: ?(ignore|skip)$", skip = true },
  { footer = "(?i)^release-note: ?(ignore|skip)$", skip = true },

  # Merge commits duplicate the commits already included from the merged
  # branch and often include noisy pull request bodies.
  { message = "^Merge pull request\\b", skip = true },
  { message = "^Merge (remote-tracking )?branch\\b", skip = true },
  { message = "^Merge tag\\b", skip = true },
  { message = "^Merge\\b", skip = true },

  # Generated release/version housekeeping.
  { message = "(?i)^chore\\(version\\):", skip = true },
  { message = "(?i)^chore\\(release\\):", skip = true },
  { message = "(?i)^chore\\((pr|pull)\\):", skip = true },
  { message = "(?i)^chore: (prepare( a)? release|release|bump version|set version)\\b", skip = true },
  { message = "(?i)^version v?[0-9]", skip = true },

  # Security must precede the ordinary type parsers and the catch-all rule.
  { message = "(?i)^security(?:\\([^)]*\\))?!?:", group = "🛡️ Security" },
  { field = "scope", pattern = "(?i)^security$", group = "🛡️ Security" },
  { body = "(?i).*security", group = "🛡️ Security" },

  # Conventional Commit groups, ordered by user impact.
  { message = "^feat", group = "🚀 Features" },
  { message = "^fix", group = "🐛 Bug Fixes" },
  { message = "^perf", group = "⚡ Performance" },
  { message = "^refactor", group = "🚜 Refactoring" },
  { message = "^docs?", group = "📚 Documentation" },
  { message = "^style", group = "🎨 Style" },
  { message = "^test", group = "🧪 Tests" },
  { message = "^(build|chore)\\(deps(?:-dev)?\\)", group = "📦 Dependencies" },
  { message = "^build", group = "🏗️ Build System" },
  { message = "^ci", group = "👷 Continuous Integration" },
  { message = "^chore", group = "⚙️ Miscellaneous Chores" },
  { message = "^revert", group = "◀️ Reverts" },

  # Keep unconventional and unknown commit types visible.
  { message = ".*", group = "💼 Other" },
]

filter_commits = false
fail_on_unmatched_commit = false

# Match stable, prerelease, and build-metadata SemVer tags prefixed with "v".
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?$"

# Preserve release history and commit chronology across merged branches.
use_branch_tags = false
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
recurse_submodules = false
