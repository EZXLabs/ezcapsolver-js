version: 2
updates:
  # npm. The package ships no runtime dependencies, so this only tracks the
  # toolchain — a PR touching `dependencies` rather than `devDependencies` is a
  # signal that something was added.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      # The toolchain moves together and is never part of what users install;
      # reviewing it as one PR a week beats reviewing nine.
      toolchain:
        dependency-type: development

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
